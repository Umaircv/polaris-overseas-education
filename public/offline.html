<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#031d39" />
    <title>Polaris Global Education Center · Offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px;display:grid;place-items:center;background:radial-gradient(circle at 75% 15%,#0b5d94,#031d39 55%);color:#fff;font-family:Arial,sans-serif}.card{max-width:520px;padding:42px;border:1px solid rgba(255,255,255,.18);border-radius:12px 34px 12px 34px;background:rgba(255,255,255,.08);box-shadow:0 28px 80px rgba(0,0,0,.25);text-align:center}.card img{width:120px}.card h1{margin:24px 0 12px;font:500 44px/1.05 Georgia,serif}.card p{margin:0;color:#c1d5e3;line-height:1.7}.card button{min-height:50px;margin-top:28px;padding:0 24px;border:0;border-radius:8px;background:#f3aa18;color:#031d39;font-weight:800;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/pwa-icon-192.png" alt="Polaris Global Education Center" />
      <h1>You’re currently offline.</h1>
      <p>Previously opened pages may still be available. Reconnect to load the latest courses, guides and application information.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
